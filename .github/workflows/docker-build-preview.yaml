name: docker-build-preview

# Builds rootgg/plik:pr-<N> and pr-<N>-<sha7> on every push to a PR labeled
# "preview", for the PR preview environments (pr-<N>.plik.bodji.net).
# Branches of this repository only: fork PRs get no secrets and keep using
# the "docker build" comment.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  build:
    name: Build
    if: >-
      github.event.pull_request.head.repo.full_name == 'root-gg/plik' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    uses: ./.github/workflows/docker-build-reusable.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      head_repo: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

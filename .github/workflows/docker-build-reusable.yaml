name: docker-build-reusable

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_ref:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      head_sha:
        description: Commit to build (defaults to the tip of head_ref)
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  docker-build:
    name: Docker Build & Push
    # One build at a time per PR, whatever the trigger (comment or label), so
    # the immutable tag below is always copied from the image just pushed.
    concurrency:
      group: docker-build-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha || inputs.head_ref }}
          repository: ${{ inputs.head_repo }}

      - name: Fetch tags
        run: |
          git fetch --prune --unshallow --tags

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          VERSION="${LATEST_TAG}-pr-${{ inputs.pr_number }}-${SHORT_COMMIT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          TAG: pr-${{ inputs.pr_number }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: "false"
          PUSH_TO_DOCKER_HUB: "true"
        run: make release-and-push-to-docker-hub

      # Immutable tag for PR previews (k3s ResourceSet): pr-<N>-<sha7>.
      # --short=7: git would print 8+ characters on this repository.
      - name: Tag immutable preview image
        run: |
          SHA7=$(git rev-parse --short=7 HEAD)
          docker buildx imagetools create \
            -t "rootgg/plik:pr-${{ inputs.pr_number }}-${SHA7}" \
            "rootgg/plik:pr-${{ inputs.pr_number }}"

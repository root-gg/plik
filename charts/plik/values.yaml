# Default values for plik.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of pod replicas.
# Keep this at 1 with the default SQLite metadata backend and/or the `file` data backend:
# running several replicas requires a shared SQL database (PostgreSQL/MySQL) and a remote data backend (S3, GCS, Swift).
replicaCount: 1

image:
  # -- Docker image repository
  repository: rootgg/plik
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Docker registry pull secrets
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Automatically mount the service account token
  automount: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Additional pod annotations
podAnnotations: {}

# -- Pod-level security context.
# Defaults match the `plik` user (UID/GID 1000) baked into the `rootgg/plik` image and comply with the
# Kubernetes "restricted" Pod Security Standard. `fsGroup` makes mounted volumes (PVCs) writable by plikd.
# @default -- non-root UID/GID 1000, `fsGroup: 1000`, `RuntimeDefault` seccomp profile
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
# plikd only writes to the mounted data/db volumes (and `/tmp`), so the root filesystem is read-only by default.
# @default -- read-only root filesystem, no privilege escalation, all capabilities dropped
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Liveness probe timings (TCP check on the http port).
# The probe handler is generated by the chart; only timing fields are read from here.
# @default -- see sub-values
livenessProbe:
  # -- Enable the liveness probe
  enabled: true
  # -- How often (in seconds) to perform the probe
  periodSeconds: 20
  # -- Probe timeout in seconds
  timeoutSeconds: 3
  # -- Consecutive failures before the container is restarted
  failureThreshold: 3

# -- Readiness probe timings (HTTP GET on `<plikd.Path>/health`, HTTPS when `plikd.SslEnabled` is true).
# The probe handler is generated by the chart; only timing fields are read from here.
# @default -- see sub-values
readinessProbe:
  # -- Enable the readiness probe
  enabled: true
  # -- How often (in seconds) to perform the probe
  periodSeconds: 10
  # -- Probe timeout in seconds
  timeoutSeconds: 3
  # -- Consecutive failures before the pod is removed from Service endpoints
  failureThreshold: 3

# -- Startup probe timings (TCP check on the http port). Protects slow starts (e.g. long metadata
# migrations) from being killed by the liveness probe. Default allows up to 5 minutes.
# @default -- see sub-values
startupProbe:
  # -- Enable the startup probe
  enabled: true
  # -- How often (in seconds) to perform the probe
  periodSeconds: 10
  # -- Probe timeout in seconds
  timeoutSeconds: 3
  # -- Consecutive failures before the container is restarted
  failureThreshold: 30

networkPolicy:
  # -- Create a NetworkPolicy restricting ingress traffic to the plik pod (requires a CNI that enforces NetworkPolicies)
  enabled: false
  # -- Peers allowed to reach the http (and metrics, if `plikd.MetricsPort` is set) port.
  # Empty = allow from all sources. Accepts standard NetworkPolicy `from` entries.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # -- Egress rules. When non-empty, the `Egress` policy type is enforced and only these destinations are allowed
  # (remember DNS, the metadata database, the data backend and OAuth providers). Empty = egress unrestricted.
  egress: []
  #  - to:
  #      - namespaceSelector: {}
  #        podSelector:
  #          matchLabels:
  #            k8s-app: kube-dns
  #    ports:
  #      - port: 53
  #        protocol: UDP

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- Service port
  port: 8080
  # -- Additional service annotations
  annotations: {}

ingress:
  # -- Enable Ingress resource
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Additional ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress host rules
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- CPU/memory resource requests and limits
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  #   ephemeral-storage: 1Gi

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# Plik specific configuration
# This section mirrors the plikd.cfg configuration file

# -- Workload kind: `Deployment` or `StatefulSet`.
# Use StatefulSet if you are using the `file` backend with a PersistentVolume.
kind: Deployment

persistence:
  # -- Enable persistent storage for uploaded files
  enabled: false
  # -- Storage class name (uses cluster default if unset)
  # storageClassName: default
  # -- PVC access modes
  accessModes:
    - ReadWriteOnce
  # -- PVC storage size
  size: 10Gi
  # annotations: {}
  # -- Mount path for file storage inside the container
  path: /home/plik/server/files
  # -- Size limit of the `emptyDir` volume used when persistence is disabled (e.g. `5Gi`, empty = no limit).
  # Without a limit, uploads can fill up the node's disk.
  emptyDirSizeLimit: ""

dbPersistence:
  # -- Enable persistent storage for the SQLite database
  enabled: false
  # -- Storage class name (uses cluster default if unset)
  # storageClassName: default
  # -- PVC access modes
  accessModes:
    - ReadWriteOnce
  # -- PVC storage size
  size: 1Gi
  # annotations: {}
  # -- Mount path for the database inside the container
  path: /home/plik/server/db
  # -- Size limit of the `emptyDir` volume used when persistence is disabled (e.g. `1Gi`, empty = no limit)
  emptyDirSizeLimit: ""

# -- Plik server configuration. Values are rendered into the `plikd.cfg` config file.
# See [server configuration reference](https://github.com/root-gg/plik/tree/master/server/plikd.cfg) for all options.
# @default -- see sub-values
plikd:
  # -- Enable debug mode
  Debug: false
  # -- Log every HTTP request
  DebugRequests: false
  # -- Log level (`DEBUG`, `INFO`, `WARNING`, `CRITICAL`)
  LogLevel: "INFO"

  # -- HTTP listen port
  ListenPort: 8080
  # -- HTTP listen address
  ListenAddress: "0.0.0.0"
  # -- Prometheus metrics port (0 = disabled)
  MetricsPort: 0
  # -- Prometheus metrics listen address
  MetricsAddress: "0.0.0.0"
  # -- URL path prefix (e.g. `/plik`)
  Path: ""
  # -- Enable HTTPS
  SslEnabled: false
  # -- Path to TLS certificate
  SslCert: "plik.crt"
  # -- Path to TLS private key
  SslKey: "plik.key"
  # -- Minimum TLS version (`tlsv10`, `tlsv11`, `tlsv12`, `tlsv13`)
  TlsVersion: "tlsv10"
  # -- Disable the web interface
  NoWebInterface: false
  # -- Public webapp URL for OAuth redirects, CORS, and download domain redirects (e.g., `https://plik.example.com`)
  PlikDomain: ""
  # -- Custom download domain
  DownloadDomain: ""
  # -- Additional download domain aliases
  DownloadDomainAlias: []
  # -- Deprecated: use AssumeHTTPS instead. Kept for backward compatibility — if true, enables AssumeHTTPS with a deprecation warning at startup.
  EnhancedWebSecurity: false
  # -- Enable HSTS and Secure cookies (auto-enabled when SslEnabled=true or PlikDomain starts with https://)
  AssumeHTTPS: false
  # -- User session timeout (e.g. `365d`, `24h`)
  SessionTimeout: "365d"
  # -- Abuse contact email displayed in the footer
  AbuseContact: ""
  # -- Path to the webapp distribution directory
  WebappDirectory: "../webapp/dist"
  # -- Path to the pre-built CLI clients directory
  ClientsDirectory: "../clients"
  # -- Path to the changelog directory
  ChangelogDirectory: "../changelog"
  # -- HTTP header to use for source IP (e.g. `X-Forwarded-For`)
  SourceIpHeader: ""
  # -- IP whitelist for uploads (empty = allow all)
  UploadWhitelist: []

  # -- Enable zip compression for archive downloads.
  # When true (default), archives use zip.Deflate (smaller files but higher CPU usage).
  # Set to false to use zip.Store (no compression) to prevent CPU exhaustion DoS on public instances.
  EnableArchiveCompression: true

  # -- Maximum file size per upload (e.g. `10GB`, `unlimited`)
  MaxFileSizeStr: "10GB"
  # -- Maximum total size per user (e.g. `10GB`, `unlimited`)
  MaxUserSizeStr: "unlimited"
  # -- Maximum number of files per upload
  MaxFilePerUpload: 1000

  # -- Default upload TTL (e.g. `30d`, `24h`)
  DefaultTTLStr: "30d"
  # -- Maximum upload TTL
  MaxTTLStr: "30d"

  # -- Login for the default local admin user to create on first startup (empty = disabled).
  # Idempotent: skipped if the user already exists.
  DefaultAdminLogin: ""

  # -- Enable user authentication (`enabled`, `disabled`, `forced`)
  FeatureAuthentication: "disabled"
  # -- Enable local login
  FeatureLocalLogin: "enabled"
  # -- Allow users to delete their account
  FeatureDeleteAccount: "enabled"
  # -- Enable one-shot downloads
  FeatureOneShot: "enabled"
  # -- Enable removable uploads
  FeatureRemovable: "enabled"
  # -- Enable streaming uploads
  FeatureStream: "enabled"
  # -- Enable password-protected uploads
  FeaturePassword: "enabled"
  # -- Enable upload comments
  FeatureComments: "enabled"
  # -- Allow users to set a custom TTL
  FeatureSetTTL: "enabled"
  # -- Allow users to extend an existing TTL
  FeatureExtendTTL: "disabled"
  # -- Enable pre-built CLI clients download page
  FeatureClients: "enabled"
  # -- Enable API token creation and usage. When disabled with FeatureAuthentication=forced, FeatureClients is also auto-disabled.
  FeatureApiTokens: "enabled"
  # -- Show GitHub link in the footer
  FeatureGithub: "enabled"
  # -- Enable plain-text paste mode
  FeatureText: "enabled"

  # -- Google OAuth2 client ID
  GoogleApiClientID: ""
  # -- Allowed Google domains (empty = allow all)
  GoogleValidDomains: []

  # -- OVH API endpoint (e.g. `ovh-eu`, `ovh-ca`)
  OvhApiEndpoint: ""

  # -- OpenID Connect client ID
  OIDCClientID: ""
  # -- OpenID Connect provider discovery URL
  OIDCProviderURL: ""
  # -- Display name for the OIDC provider
  OIDCProviderName: "OpenID"
  # -- Allowed OIDC email domains (empty = allow all)
  OIDCValidDomains: []
  # -- Require verified email from OIDC provider
  OIDCRequireVerifiedEmail: false

  # -- GitHub OAuth app client ID
  GitHubApiClientID: ""
  # -- Restrict to GitHub organization members (empty = allow all)
  GitHubValidOrganizations: []

  # -- Data backend type (`file`, `gcs`, `s3`, `swift`)
  DataBackend: "file"
  # -- Non-sensitive data backend configuration.
  # Keys depend on the backend type. See [data backends](https://github.com/root-gg/plik#data-backends).
  DataBackendConfig:
    Directory: "files"
    # GCS
    # Bucket: "MyAwesomeBucket"
    # Folder: "plik"
    # Swift
    # Container: "plik"
    # AuthUrl: "https://auth.swiftauthapi.xxx/v2.0/"
    # UserName: "user@tld.net"
    # Domain: "domain"
    # Tenant: "tenant"
    # S3
    # Endpoint: "127.0.0.1:9000"
    # AccessKeyID: "access_key_id"
    # Bucket: "plik"
    # Location: "us-east-1"
    # Prefix: ""
    # UseSSL: true
    # BucketLookup: "auto"  # Bucket addressing style: "auto" (default), "dns" (virtual-hosted), "path" (required for Cloudflare R2 and some MinIO deployments)
    # PartSize: 16777216
    # PartUploadConcurrency: 4
    # SSE: ""

  # -- Metadata backend configuration (database driver, connection string)
  MetadataBackendConfig:
    Driver: "sqlite3"
    ConnectionString: "/home/plik/server/db/plik.db"
    Debug: false

# ─── Sensitive Credentials ────────────────────────────────────────────────────
# All secret values are stored in a Kubernetes Secret, never in a ConfigMap.
# The application reads these values from environment variables at startup.
#
# To use a pre-existing Secret (e.g. managed by Vault, Sealed Secrets, ESO):
#   secrets.existingSecret: "my-plik-secret"
# The external secret must expose the same env var keys listed below.
secrets:
  # -- Use an existing Kubernetes Secret instead of creating one.
  # The Secret must contain the relevant env var keys.
  existingSecret: ""

  # -- Google OAuth2 client secret (injected as `PLIKD_GOOGLE_API_SECRET`)
  googleApiSecret: ""

  # -- OVH API key (injected as `PLIKD_OVH_API_KEY`)
  ovhApiKey: ""
  # -- OVH API secret (injected as `PLIKD_OVH_API_SECRET`)
  ovhApiSecret: ""

  # -- OIDC client secret (injected as `PLIKD_OIDC_CLIENT_SECRET`)
  oidcClientSecret: ""

  # -- Default admin password (injected as `PLIKD_DEFAULT_ADMIN_PASSWORD`).
  # If empty, a random password is generated and logged on first startup.
  defaultAdminPassword: ""

  # -- GitHub OAuth app client secret (injected as `PLIKD_GIT_HUB_API_SECRET`)
  githubApiSecret: ""

  # -- Sensitive data backend config (merged with `plikd.DataBackendConfig` at runtime).
  # Injected as `PLIKD_DATA_BACKEND_CONFIG` JSON.
  dataBackend: {}
  #   SecretAccessKey: ""
  #   ApiKey: ""

  # -- Sensitive metadata backend config (e.g. database password).
  # Injected as `PLIKD_METADATA_BACKEND_CONFIG` JSON.
  metadataBackend: {}
  #   Password: ""

apiVersion: apps/v1
kind: {{ .Values.kind }}
metadata:
  name: {{ include "plik.fullname" . }}
  labels:
    {{- include "plik.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.kind "StatefulSet" }}
  serviceName: {{ include "plik.fullname" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "plik.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "plik.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            {{- toYaml (omit .Values.startupProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ trimSuffix "/" (.Values.plikd.Path | default "") }}/health
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" (.Values.plikd.SslEnabled | default false) }}
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /home/plik/server/plikd.cfg
              subPath: plikd.cfg
            - name: data
              mountPath: {{ .Values.persistence.path }}
            - name: db
              mountPath: {{ .Values.dbPersistence.path }}
            - name: tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: {{ include "plik.secretName" . }}
                optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "plik.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.kind "Deployment" }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "plik.fullname" . }}
          {{- else }}
          {{- with .Values.persistence.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        - name: db
          {{- if .Values.dbPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "plik.fullname" . }}-db
          {{- else }}
          {{- with .Values.dbPersistence.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        {{- end }}
  {{- if eq .Values.kind "StatefulSet" }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    - metadata:
        name: db
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.dbPersistence.storageClassName }}
        storageClassName: {{ .Values.dbPersistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.dbPersistence.size }}
  {{- end }}
